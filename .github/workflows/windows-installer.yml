name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: ["work", "main", "master"]

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build DocFind executable
        shell: pwsh
        run: ./desktop/build_exe.ps1 -Clean

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer EXE
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\DocFind.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFind-Windows-Installer
          path: dist/installer/DocFind-Setup.exe

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFind-Portable
          path: dist/DocFind/**
